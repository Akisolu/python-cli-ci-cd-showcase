name: CI/CD - Test, Build & Release

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # ==========================================
  # 1. TEST STAGE (CI)
  # ==========================================
  test:
    name: Run Test Suite
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest pytest-cov pydantic

      - name: Run test suite
        run: |
          python -m pytest tests/ -v

  # ==========================================
  # 2. BUILD STAGE (CD)
  # ==========================================
  build:
    name: Build Executable (${{ matrix.os }})
    needs: test  # Runs only if the test suite passes successfully
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact_name: restaurant_cli_windows.exe
            executable_path: dist/restaurant_cli.exe
          - os: ubuntu-latest
            artifact_name: restaurant_cli_linux
            executable_path: dist/restaurant_cli

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project dependencies and PyInstaller
        shell: bash
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pyinstaller pydantic

      - name: Build executable with PyInstaller
        run: |
          pyinstaller --onefile --name "restaurant_cli" main.py

      - name: Rename artifact for target OS
        shell: bash
        run: |
          mv ${{ matrix.executable_path }} ${{ matrix.artifact_name }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: restaurant-cli-${{ matrix.os }}
          path: ${{ matrix.artifact_name }}

  # ==========================================
  # 3. GitHub Release Creation (Tags only)
  # ==========================================
  release:
    name: Create GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write # Permission required to upload binaries to the release
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: bin/

      - name: Publish Release on GitHub
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            bin/restaurant-cli-windows-latest/restaurant_cli_windows.exe
            bin/restaurant-cli-ubuntu-latest/restaurant_cli_linux
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}